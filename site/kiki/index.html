<style>
/* Layout: one-screen app. HUD on top, Kiki's face in the middle, the fairy deck at the bottom; every other view is an overlay.
   v2 look: a soft lavender night for a teen diary mood. Pastel pink, peach and butter accents; SEOUL 1988 cream bottle + red label stays on every product. */
:root{
  --night:#241E48; --night-2:#2F2860; --night-3:#3D357A; --night-4:#4B4394;
  --moon:#FFF6E3; --cream:#EAE4CF; --butter:#FFF1B8; --red:#DD5868; --red-deep:#C64046;
  --pink:#FFD6E0; --peach:#FFC9B5; --mint:#C9F2E5; --lav:#D9CCFF; --heart:#FF8FA3;
  --fg:#FFF8F2; --mute:#C4BCE6; --line:rgba(255,246,227,.16); --line-2:rgba(255,246,227,.3);
  --glow:#FFE9A8; --good:#8FE3A6; --warn:#FFD36B; --bad:#FF7E8A; --eye:#D9CCFF;
  --display:"Fredoka","Jua","Apple SD Gothic Neo",sans-serif;
  --body:"Nunito","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --diary:"Caveat","Gaegu","Apple SD Gothic Neo",cursive;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--night)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
a{color:var(--glow)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- HUD ---------- */
.hud{padding-block:8px 6px;display:grid;gap:4px}
.hud-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.night-chip{font:600 .78rem/1.1 var(--display);letter-spacing:.02em;color:var(--mute);min-width:0}
.night-chip b{display:block;color:var(--fg);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font:600 clamp(1.7rem,6vw,2.3rem)/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em}
.hud-right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.combo{font:600 .9rem/1 var(--display);padding:.38rem .6rem;border-radius:999px;background:var(--night-3);color:var(--glow);letter-spacing:.04em;min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;transition:background .2s,transform .2s}
.combo.hot{background:var(--red);color:#fff}
.combo.bump{transform:scale(1.12)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--night-2);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,background .2s}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bars{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.hud-ks{height:11px;color:var(--mute);opacity:.85}
.bars .lbl,.prog{font:500 .78rem/1 var(--display);letter-spacing:.02em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.glowbar{height:8px;border-radius:4px;background:var(--night-3);overflow:hidden}
.glowbar i{display:block;height:100%;width:var(--w,100%);background:linear-gradient(90deg,var(--butter),var(--glow));transition:width .4s var(--ease)}
.glowbar.low i{background:linear-gradient(90deg,var(--red-deep),var(--bad))}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 60% at 50% 100%,rgba(255,143,163,.28) 0%,rgba(255,143,163,0) 60%),linear-gradient(180deg,#1C1740 0%,#2F2860 55%,#4B3F8C 100%)}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:var(--o,.6);animation:twinkle var(--d,3s) ease-in-out infinite alternate}
.moon{position:absolute;top:6%;right:8%;width:clamp(44px,9vw,72px);aspect-ratio:1;border-radius:50%;background:var(--moon);box-shadow:0 0 40px 12px rgba(246,242,231,.18),inset -10px -6px 0 0 #DED8C2}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:22%;pointer-events:none;opacity:.9}
.facebox{position:relative;--glow:1;--wince:0;transition:filter .5s}
.facebox>svg.kiki{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(calc(.5 + .5*var(--glow))) drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.facebox.shield::after{content:"";position:absolute;inset:6% 10% 14%;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 50% 30%,rgba(198,64,70,.08),rgba(246,242,231,.25));box-shadow:0 0 0 3px rgba(246,242,231,.6),0 0 40px rgba(246,242,231,.35);pointer-events:none;animation:shieldPulse 1.2s ease-in-out infinite}
.zzz{position:absolute;left:74%;top:3%;font:600 1.1rem var(--display);color:var(--mute);opacity:.7;pointer-events:none;animation:zz 3s ease-in-out infinite}

.curse{position:absolute;left:var(--x);top:var(--y);width:var(--cw);aspect-ratio:1;transform:translate(-50%,-50%) scale(var(--s,1));border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;transition:transform .3s var(--ease);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));-webkit-tap-highlight-color:transparent}
.curse svg{width:100%;height:100%;display:block;overflow:visible}
.curse .pips{position:absolute;left:50%;bottom:-9%;transform:translateX(-50%);display:flex;gap:3px}
.curse .pips i{width:6px;height:6px;border-radius:50%;background:rgba(246,242,231,.3);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.curse .pips i.on{background:var(--fg)}
.curse.s3 .pips i.on{background:var(--bad)}
.curse.s3::before{content:"";position:absolute;inset:-10%;border-radius:50%;border:2px solid var(--bad);animation:ring 1s ease-in-out infinite}
.curse.spawn{animation:spawn .4s var(--ease)}
.curse.hit{animation:hitWobble .3s}
.curse.gone{animation:gone .35s forwards;pointer-events:none}
.curse.setin{animation:setin .55s forwards;pointer-events:none}
.curse.target{filter:drop-shadow(0 0 10px var(--glow)) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.curse:focus-visible{outline:3px solid var(--glow);outline-offset:4px;border-radius:50%}
.spark{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--c,var(--glow));pointer-events:none;z-index:30;animation:spark .6s var(--ease) forwards}
.pop{position:fixed;transform:translate(-50%,-50%);font:600 1rem/1 var(--display);letter-spacing:.04em;color:var(--glow);pointer-events:none;z-index:31;animation:pop .9s var(--ease) forwards;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap}
.pop.bad{color:var(--bad)}
.pop.note{font-size:.82rem;color:var(--fg)}

.powers{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:10px;z-index:5}
.power{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.power .ring{width:52px;height:52px;border-radius:50%;background:var(--night-2);border:2px solid var(--acc);display:grid;place-items:center;box-shadow:0 8px 20px -10px var(--acc);transition:transform .15s}
.power .ring svg{width:34px;height:42px}
.power .ring .pimg{width:46px;height:46px}
.power .plabel{font:600 .66rem/1 var(--display);letter-spacing:.01em;color:var(--mute);text-align:center}
.power:disabled{opacity:.35;cursor:default}
.power:not(:disabled):hover .ring{transform:scale(1.06)}

.wand{position:fixed;width:26px;height:26px;pointer-events:none;z-index:32;transform:translate(-50%,-50%);display:none}
.wand.on{display:block}
.wand::before,.wand::after{content:"";position:absolute;inset:0;background:var(--acc,var(--glow));clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spin 2s linear infinite}
.wand::after{transform:scale(.45) rotate(45deg);background:#fff;animation:none}

/* ---------- deck ---------- */
.deck{padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:linear-gradient(180deg,rgba(20,18,36,0),var(--night) 30%)}
@media (min-width:760px){.deck{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.deck .fairy{width:96px;flex:none}}
.fairy{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:14px;background:var(--night-2);border:1.5px solid var(--line);color:var(--fg);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;min-width:0}
.fairy .icon{width:56px;height:56px;pointer-events:none}
.fairy .icon svg{width:100%;height:100%;overflow:visible}
.fairy .name{font:600 .74rem/1 var(--display);letter-spacing:.01em;pointer-events:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fairy .vs{display:flex;gap:3px;height:6px;pointer-events:none}
.fairy .vs i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.fairy .key{position:absolute;top:4px;left:6px;font:500 .62rem/1 var(--display);color:var(--mute);pointer-events:none}
.fairy .tag{position:absolute;top:3px;right:4px;font:600 .55rem/1 var(--display);letter-spacing:.06em;padding:.2em .35em;border-radius:5px;background:var(--eye);color:#2B1B45;pointer-events:none}
.fairy .charges{display:flex;gap:3px;height:6px;pointer-events:none}
.fairy .charges i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.fairy .charges i.used{background:var(--line-2)}
.fairy .cd{position:absolute;inset:0;border-radius:inherit;background:conic-gradient(rgba(20,18,36,.8) calc(var(--p,0)*100%),transparent 0);pointer-events:none;opacity:0;transition:opacity .15s}
.fairy.cooling .cd{opacity:1}
.fairy.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent),0 10px 24px -12px var(--acc);transform:translateY(-4px)}
.fairy.stunned{filter:grayscale(1) brightness(.7)}
.fairy.shake{animation:shake .4s}
.fairy.new{animation:newcard .8s var(--ease)}
.fairy:hover{border-color:var(--line-2)}

/* ---------- overlays ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:rgba(20,18,36,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);overflow:auto;overscroll-behavior:contain}
.screen.title{background:var(--night)}
.card{width:min(600px,100%);margin:auto;background:var(--night-2);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 30px 80px -30px rgba(0,0,0,.7);display:grid;gap:14px;min-width:0}
.card.wide{width:min(900px,100%)}
.eyebrow{font:600 .82rem/1 var(--display);letter-spacing:.04em;color:var(--pink);display:flex;align-items:center;gap:.5em}
.eyebrow::before{content:"♥";font-size:.8em;color:var(--heart)}
.h-display{font:600 clamp(1.6rem,5vw,2.3rem)/1.15 var(--display);letter-spacing:0}
.quote{font:500 clamp(1.3rem,4.5vw,1.6rem)/1.3 var(--diary);color:var(--fg);background:rgba(255,214,224,.08);border:1.5px dashed rgba(255,214,224,.35);border-radius:16px;padding:.7em .9em;margin:0;position:relative}
.quote::before{content:"";position:absolute;top:-9px;left:18px;width:34px;height:14px;background:var(--pink);opacity:.8;border-radius:2px;transform:rotate(-6deg)}
.lede{color:var(--mute);margin:0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{font:600 1.02rem/1 var(--display);letter-spacing:.02em;padding:.95rem 1.5rem;border-radius:999px;border:1.5px solid var(--line-2);background:transparent;color:var(--fg);cursor:pointer;transition:background .2s,border-color .2s,transform .1s;display:inline-flex;align-items:center;gap:.5em;justify-content:center;min-width:0}
.btn:hover{background:var(--night-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.block{width:100%}
.btn.sm{padding:.6rem 1rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--night-3);border:1px solid var(--line);font-size:.86rem;min-width:0}
.chip .ic{width:30px;height:30px;display:grid;place-items:center}
.chip .ic svg{width:100%;height:100%;overflow:visible}
.chip .ic.f{width:40px;height:40px}
.chip b{font-weight:600}
.chip small{display:block;color:var(--mute);font-size:.74rem;line-height:1.2}

/* title */
.title-art{position:relative;width:min(54vw,270px);aspect-ratio:400/520;--glow:1;--wince:0;--awake:1;margin-bottom:0}
.title-art svg{width:100%;height:100%;display:block;filter:drop-shadow(0 24px 40px rgba(0,0,0,.5))}
.title-art .moon{top:-6%;right:-14%;width:58px}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(560px,100%);text-align:center;position:relative;z-index:1;margin:auto}
.presents{font:600 .74rem/1 var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--butter)}
.logo{font:700 clamp(2.6rem,11vw,4.2rem)/1 var(--display);letter-spacing:-.01em;color:var(--fg);text-shadow:0 6px 24px rgba(255,143,163,.25)}
.logo span{color:var(--pink)}
.tagline{font-size:1rem;color:var(--mute);margin:0}
.title-btns{display:grid;gap:10px;width:min(340px,100%);margin-top:6px}
.title-foot{display:flex;gap:8px;justify-content:center;margin-top:8px}
.title-foot .btn{font-size:.75rem;padding:.55rem .9rem}
.title-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}

/* how to */
.steps{display:grid;gap:12px}
@media (min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--night-3);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start}
.step .n{font:600 .74rem/1 var(--display);letter-spacing:.14em;color:var(--butter)}
.step h3{font-size:1.05rem}
.step p{margin:0;color:var(--mute);font-size:.9rem}
.step .viz{height:84px;display:flex;align-items:center;justify-content:center;gap:12px}
.step .viz svg{height:70px;width:auto;overflow:visible}
.step .viz .arrow{font:600 1.4rem var(--display);color:var(--mute)}
.step .viz .hv{width:84px;height:84px;display:block}

/* night intro / summary */
.stat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat span{color:var(--mute)}
.stat b{font:600 1.3rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat b.good{color:var(--good)} .stat b.bad{color:var(--bad)} .stat b.gold{color:var(--glow)}
.bigscore{font:600 clamp(2.6rem,10vw,4rem)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--glow);letter-spacing:.02em}
.badge{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em;border-radius:999px;background:var(--butter);color:#2B2410;font:600 .85rem/1 var(--display);letter-spacing:.02em}
.mvp{display:grid;gap:8px}
.mvp a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);padding:8px 10px;border-radius:14px;background:var(--night-3);border:1px solid var(--line)}
.mvp a:hover{border-color:var(--line-2)}
.mvp .ic{width:56px;height:56px;flex:none}
.mvp .ic svg{width:100%;height:100%;overflow:visible}
.mvp small{display:block;color:var(--mute);font-size:.78rem}
.mvp .cnt{margin-left:auto;font:600 1rem var(--display);color:var(--glow);font-variant-numeric:tabular-nums}

/* form */
.form{display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font:600 .82rem/1 var(--display);letter-spacing:.02em;color:var(--mute)}
.field input,.field select{width:100%;font:inherit;font-size:1rem;padding:.75rem .9rem;border-radius:12px;border:1.5px solid var(--line-2);background:var(--night);color:var(--fg);min-width:0}
.field input:focus,.field select:focus{outline:2px solid var(--glow);outline-offset:1px;border-color:transparent}
.field .err{color:var(--bad);font-size:.82rem;min-height:1.2em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--mute)}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--red)}
.note{font-size:.82rem;color:var(--mute);margin:0}
.toast-wrap{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;display:grid;gap:6px;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--cream);color:#2B2410;font:500 .9rem/1.3 var(--body);padding:.6rem .9rem;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);animation:toast 2.2s var(--ease) forwards;text-align:center}
.toast.bad{background:var(--red);color:#fff}

/* leaderboard */
.lb{display:grid;gap:4px;max-height:52vh;overflow:auto;padding-right:4px;overscroll-behavior:contain}
.lb-row{display:grid;grid-template-columns:2.4em 1.6em 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--night-3);font-size:.95rem;min-width:0}
.lb-row .r{font:600 1rem/1 var(--display);color:var(--mute);font-variant-numeric:tabular-nums}
.lb-row.prize .r{color:var(--glow)}
.lb-row .flag{font-size:1.15rem;line-height:1}
.lb-row .nm{display:flex;align-items:baseline;gap:.4em;min-width:0;font-weight:500}
.lb-row .nm em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lb-row .nm small{flex:none;color:var(--mute);font-weight:400;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.lb-row .ni{font:500 .78rem/1 var(--display);color:var(--mute);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.lb-row .sc{font:600 1rem/1 var(--display);font-variant-numeric:tabular-nums}
.lb-row.me{background:var(--red);color:#fff}
.lb-row.me .r,.lb-row.me .ni,.lb-row.me .nm small{color:rgba(255,255,255,.85)}
.lb-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lb-mine{font-size:.95rem;padding:10px 14px;border-radius:12px;background:var(--night-3);border:1px dashed var(--line-2)}

/* codex */
.codex{display:grid;gap:10px;max-height:62vh;overflow:auto;padding-right:4px;overscroll-behavior:contain}
@media (min-width:700px){.codex{grid-template-columns:1fr 1fr}}
.cx{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px;border-radius:16px;background:var(--night-3);border:1px solid var(--line);min-width:0}
.cx .ic{width:84px;height:84px}
.cx .ic svg{width:100%;height:100%;overflow:visible}
.cx h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cx .prod{font-size:.84rem;color:var(--fg);margin:2px 0 0}
.cx .prod small{display:block;color:var(--mute);font-size:.76rem}
.cx .blurb{font-size:.82rem;color:var(--mute);margin:4px 0 0}
.cx .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{font:600 .7rem/1 var(--display);letter-spacing:.02em;padding:.35em .6em;border-radius:999px;background:var(--night-2);border:1px solid var(--line-2);color:var(--mute)}
.pill.eye{background:var(--eye);color:#2B1B45;border-color:transparent}
.pill.acc{background:var(--acc);color:#1B1830;border-color:transparent}
.cx .vs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cx .vs span{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;color:var(--mute)}
.cx .vs svg{width:18px;height:18px}
.cx a{font-size:.8rem}

/* pause */
.pause-list{display:grid;gap:10px}

/* ---------- real product photos as fairies (SVG bottle stays as fallback) ---------- */
.pimg{position:relative;display:block;width:100%;height:100%}
.pimg::before{content:"";position:absolute;left:10%;right:10%;top:12%;bottom:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,246,227,.95) 0 46%,rgba(255,246,227,0) 70%)}
.pimg .wings{position:absolute;left:-14%;top:-6%;width:128%;height:100%;opacity:.95;transform-origin:50% 55%;animation:flap 1.2s ease-in-out infinite}
.pimg .face{position:absolute;left:50%;top:var(--fy,55%);width:46%;height:23%;transform:translate(-50%,-50%);pointer-events:none;opacity:.9;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.pimg.nf .face{display:none}
.pimg img{position:absolute;left:4%;top:6%;width:92%;height:90%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.pimg>svg:not(.wings):not(.face){display:none;position:absolute;inset:0;width:100%;height:100%}
.pimg.nf img,.pimg.nf::before{display:none}
.pimg.nf>svg:not(.wings):not(.face){display:block}
/* ---------- brand layer: the official K-SECRET lockup and SEOUL 1988 wordmark, tinted through CSS masks ---------- */
.logo-s88,.logo-ks{display:inline-block;background-color:currentColor;-webkit-mask:var(--logo-s88) no-repeat center/contain;mask:var(--logo-s88) no-repeat center/contain;aspect-ratio:888/148;height:1em;vertical-align:-.12em}
.logo-ks{-webkit-mask-image:var(--logo-ks);mask-image:var(--logo-ks);aspect-ratio:452/110}
.splash{position:fixed;inset:0;z-index:60;background:var(--moon);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#2B2240;animation:splashOut .5s ease 1s forwards;cursor:pointer}
.splash .logo-ks{height:30px;color:#2B2240;animation:splashIn .6s var(--ease) both}
.splash .logo-s88{height:44px;color:var(--red-deep);animation:splashIn .6s var(--ease) .22s both}
.splash small{font:600 .78rem/1 var(--display);letter-spacing:.3em;text-transform:uppercase;color:#9A8FB8;animation:splashIn .6s var(--ease) .45s both}
.card{position:relative}
.card::after,.card::before{content:"";position:absolute;right:18px;background:var(--fg);opacity:.42;pointer-events:none;-webkit-mask:var(--logo-ks) no-repeat center/contain;mask:var(--logo-ks) no-repeat center/contain}
.card::after{top:14px;width:52px;aspect-ratio:452/110}
.card::before{top:30px;width:70px;aspect-ratio:888/148;-webkit-mask-image:var(--logo-s88);mask-image:var(--logo-s88);opacity:.5}
.wm{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:min(76%,520px);aspect-ratio:888/148;background:#fff;opacity:.055;-webkit-mask:var(--logo-s88) no-repeat center/contain;mask:var(--logo-s88) no-repeat center/contain;pointer-events:none}
.byline{display:flex;justify-content:center;margin-top:10px;opacity:.75}
.kept{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:2px}
.pop.brand{font-size:.9rem;color:var(--pink);display:inline-flex;align-items:center;gap:.4em}
@keyframes splashIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.splash{animation-delay:.6s}}

/* ---------- v2: whisper, concerns, lessons, match, share, hearts ---------- */
.whisper{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;width:min(440px,calc(100% - 96px));background:var(--moon);color:#3A2E2A;border-radius:18px;padding:8px 12px 8px 8px;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);animation:whisperIn .35s var(--ease);font-size:.86rem;line-height:1.35}
.whisper::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:var(--moon);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.whisper .ic{width:58px;height:58px;flex:none}
.whisper .ic svg{width:100%;height:100%;overflow:visible}
.whisper b{display:block;font:600 .95rem/1.2 var(--display);color:#2B2240}
.whisper.out{animation:whisperOut .3s forwards}
.fairy.hint{animation:hint 1s ease-in-out infinite;border-color:var(--pink)}
.concerns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.concern{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:18px;border:1.5px solid var(--line);background:var(--night-3);color:var(--fg);cursor:pointer;transition:border-color .15s,transform .15s,background .15s;font:600 .78rem/1.2 var(--display);text-align:center;min-width:0}
.concern svg{width:44px;height:44px;overflow:visible}
.concern small{font:400 .7rem/1.2 var(--body);color:var(--mute)}
.concern.on{border-color:var(--pink);background:rgba(255,214,224,.14);transform:translateY(-2px);box-shadow:0 0 0 3px rgba(255,214,224,.2)}
.concern.on::after{content:"♥";position:absolute;top:6px;right:9px;color:var(--heart);font-size:.9rem}
.concern{position:relative}
.lessons{display:grid;gap:8px}
.lesson{display:grid;grid-template-columns:36px auto 1fr 52px;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:var(--night-3);border:1px dashed var(--line-2);min-width:0}
.lesson svg{width:36px;height:36px;overflow:visible}
.lesson .arrow{color:var(--pink);font:600 1rem var(--display)}
.lesson .ic{width:52px;height:52px;justify-self:end}
.lesson .ic svg{width:100%;height:100%}
.lesson .txt{min-width:0;font-size:.86rem;line-height:1.3}
.lesson .txt b{display:block;font:600 .95rem/1.2 var(--display)}
.lesson .txt small{color:var(--mute);display:block;font-size:.76rem}
.match{display:grid;gap:10px}
.match a{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--fg);padding:12px;border-radius:20px;background:linear-gradient(135deg,rgba(255,214,224,.16),rgba(255,201,181,.08));border:1.5px solid rgba(255,214,224,.3);min-width:0}
.match .ic{width:84px;height:84px}
.match .ic svg{width:100%;height:100%;overflow:visible}
.match b{font:600 1.05rem/1.2 var(--display);display:block}
.match small{display:block;color:var(--mute);font-size:.8rem;line-height:1.35}
.match .why{display:block;margin-top:4px;color:var(--pink);font-size:.78rem}
.share{display:grid;gap:10px}
.share img{width:100%;max-width:320px;border-radius:18px;box-shadow:0 20px 40px -20px rgba(0,0,0,.7);display:block;margin-inline:auto}
.caption{font:500 .86rem/1.5 var(--body);background:var(--night);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--mute);white-space:pre-wrap;user-select:all;-webkit-user-select:all}
.heart{position:fixed;font-size:18px;color:var(--heart);pointer-events:none;z-index:30;animation:heartUp 1.3s var(--ease) forwards}
.ending{font:500 clamp(1.25rem,4.2vw,1.5rem)/1.45 var(--diary);color:var(--fg);text-align:center;padding:4px 0}
.chip .ic.f.big{width:34px;height:42px}
@keyframes whisperIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes whisperOut{to{opacity:0;transform:translate(-50%,10px)}}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes heartUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-120px) scale(1.2)}}

/* ---------- story intro: Instagram-story style card news ---------- */
.story{position:fixed;inset:0;z-index:50;background:#0F0C22;display:flex;align-items:center;justify-content:center;overflow:hidden}
.story-bg{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 40%,#3D357A 0%,#0F0C22 70%)}
.story-panel{position:relative;width:min(100%,460px);height:100%;background:linear-gradient(180deg,#1C1740 0%,#2F2860 60%,#4B3F8C 100%);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
@media (min-width:700px){.story-panel{height:min(100%,860px);border-radius:28px;box-shadow:0 40px 120px -40px rgba(0,0,0,.85)}}
.story-top{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:grid;gap:8px}
.story-bars{display:flex;gap:4px}
.story-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,246,227,.28);overflow:hidden}
.story-bars i b{display:block;height:100%;width:0;background:var(--moon)}
.story-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.story-head .who{display:flex;align-items:center;gap:8px;font:600 .88rem var(--display);color:var(--moon)}
.story-head .who .av{width:32px;height:32px;border-radius:50%;background:var(--night-3);border:2px solid var(--pink);overflow:hidden;display:block}
.story-head .who .av svg{width:100%;height:100%;display:block}
.story-head .btn{padding:.45rem .8rem;font-size:.78rem;background:rgba(20,18,36,.5);border-color:rgba(255,246,227,.3)}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.sc .scene{position:absolute;inset:0;overflow:hidden}
.sc .cap{position:relative;z-index:3;padding:0 22px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:linear-gradient(180deg,rgba(15,12,34,0),rgba(15,12,34,.55) 40%)}
.sc .cap .ey{font:600 .78rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--pink);opacity:0;animation:capIn .5s var(--ease) .2s forwards;padding-top:40px}
.sc .cap p{margin:0;font:500 clamp(1.3rem,5.6vw,1.65rem)/1.3 var(--display);color:var(--moon);text-wrap:balance;opacity:0;animation:capIn .6s var(--ease) .45s forwards;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.sc .cap p b{color:var(--pink);font-weight:700}
.sc .cap .diary{font:500 1.3rem/1.3 var(--diary);color:var(--butter);animation-delay:.9s}
.sc .cap .note{opacity:0;animation:capIn .6s var(--ease) 1.2s forwards}
.sc .kiki{position:absolute;left:50%;top:15%;width:min(72%,290px);transform:translateX(-50%);--glow:1;--wince:0;--awake:0}
.sc .kiki>svg{width:100%;display:block;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.sc .skyd{position:absolute;inset:0;background:linear-gradient(180deg,#FFD9B0 0%,#FFC9B5 45%,#F7B3C2 100%);transition:opacity 1.4s ease}
.sc .sun{position:absolute;right:12%;top:9%;width:64px;height:64px;border-radius:50%;background:#FFE9A8;box-shadow:0 0 60px 20px rgba(255,233,168,.55);transition:opacity 1.2s ease}
.sc .moon2{position:absolute;right:12%;top:9%;width:56px;height:56px;border-radius:50%;background:var(--moon);box-shadow:0 0 40px 12px rgba(246,242,231,.2),inset -10px -6px 0 0 #DED8C2;opacity:0;animation:capIn 1s ease 1.4s forwards}
.sc .glint,.sc .curse-pop,.sc .zap,.sc .swoop{z-index:2}
.sc .glint{position:absolute;width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:glint 1.8s ease-in-out infinite}
.sc .route{position:absolute;left:18px;top:calc(72px + env(safe-area-inset-top,0px));font:600 .78rem var(--display);letter-spacing:.08em;color:var(--moon);background:rgba(20,18,36,.55);padding:6px 10px;border-radius:999px;opacity:0;animation:capIn .6s var(--ease) .3s forwards}
.sc .fairy-fly{position:absolute;width:96px;height:96px;opacity:0;animation:flyIn .9s var(--ease) forwards,bob 3s ease-in-out infinite 1.2s}
.sc .fairy-fly .nm{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font:600 .74rem var(--display);color:var(--moon);white-space:nowrap;background:rgba(20,18,36,.55);padding:2px 8px;border-radius:999px}
.sc .curse-pop{position:absolute;width:18%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);animation:spawn2 .45s var(--ease) forwards;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.sc .curse-pop svg{width:100%;height:100%;overflow:visible}
.sc .curse-pop .lb{position:absolute;left:50%;top:100%;transform:translateX(-50%);font:600 .66rem var(--display);color:var(--moon);white-space:nowrap;background:rgba(20,18,36,.6);padding:2px 7px;border-radius:999px}
.sc .swoop{position:absolute;width:26%;aspect-ratio:1;animation:swoop 1.4s var(--ease) .5s both}
.sc .zap{position:absolute;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));animation:zapOut .5s var(--ease) 1.9s forwards}
.sc .zap svg{width:100%;height:100%;overflow:visible}
.sc .week{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(90%,400px)}
.sc .week i{aspect-ratio:1/1.5;border-radius:12px;background:rgba(255,246,227,.1);border:1px solid rgba(255,246,227,.2);display:grid;place-items:center;align-content:center;gap:5px;font:600 .72rem var(--display);color:var(--mute);opacity:0;animation:dayOn .4s var(--ease) forwards}
.sc .week i b{display:block;width:14px;height:14px;border-radius:50%;background:var(--moon);box-shadow:inset -4px -2px 0 0 #DED8C2}
.sc .week i.prom{background:rgba(255,143,163,.22);border-color:var(--pink);color:var(--pink)}
.sc .week i.prom b{background:var(--pink);box-shadow:none}
.sc .week i small{font:600 .6rem var(--display);letter-spacing:.06em}
.sc .lockup{position:absolute;left:5%;top:20%;display:grid;justify-items:center;gap:10px;width:90%;animation:capIn .8s var(--ease) both}
.sc .lockup .logo-ks{height:18px;color:var(--moon)}
.sc .lockup .logo-s88{height:40px;color:var(--moon)}
.sc .lockup .logo2{font:700 clamp(2.4rem,11vw,3.6rem)/1 var(--display);color:var(--fg);margin-top:10px;text-align:center}
.sc .lockup .logo2 span{color:var(--pink)}
.sc .cta{display:grid;gap:10px;opacity:0;animation:capIn .6s var(--ease) .8s forwards}
.sc .cta .btn.primary{animation:pulseGlow 1.6s ease-in-out infinite}
.sc .tapzone{position:absolute;inset:0;z-index:2}
.sc .callout{position:absolute;z-index:3;display:flex;align-items:center;gap:6px;transform:translate(-50%,-50%) scale(0);font:600 .74rem/1 var(--display);color:#2B1B45;background:rgba(255,246,227,.96);padding:6px 10px;border-radius:999px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5);white-space:nowrap;animation:spawn2 .45s var(--ease) forwards}
.sc .callout::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);flex:none}
@keyframes capIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glint{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes flyIn{from{opacity:0;translate:140% -20%;rotate:12deg}to{opacity:1;translate:0 0;rotate:0deg}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes spawn2{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes swoop{0%{transform:translate(90%,130%) rotate(12deg);opacity:0}60%{transform:translate(-50%,-50%) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-50%);opacity:1}}
@keyframes zapOut{to{transform:translate(-50%,-50%) scale(0) rotate(30deg);opacity:0}}
@keyframes dayOn{to{opacity:1}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(221,88,104,0)}50%{box-shadow:0 0 0 9px rgba(221,88,104,.28)}}
@media (prefers-reduced-motion:reduce){.sc .glint,.sc .fairy-fly,.sc .cta .btn.primary{animation:none;opacity:1}}

/* ---------- animations ---------- */
@keyframes twinkle{from{opacity:calc(var(--o,.6)*.4)}to{opacity:var(--o,.6)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-8px);opacity:.9}}
@keyframes ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.4}}
@keyframes spawn{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(var(--s,1))}}
@keyframes hitWobble{0%{transform:translate(-50%,-50%) scale(var(--s,1))}40%{transform:translate(-50%,-50%) scale(calc(var(--s,1)*.82)) rotate(-8deg)}100%{transform:translate(-50%,-50%) scale(var(--s,1))}}
@keyframes gone{to{transform:translate(-50%,-50%) scale(0) rotate(30deg);opacity:0}}
@keyframes setin{0%{filter:none}50%{filter:brightness(1.6) saturate(.3)}100%{transform:translate(-50%,-50%) scale(var(--s,1));opacity:0;filter:brightness(.4)}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes newcard{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
@keyframes shieldPulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
@media (prefers-reduced-motion:reduce){
  .star,.zzz,.curse.s3::before,.wand::before,.facebox.shield::after,.pimg .wings{animation:none}
  .curse,.fairy,.combo{transition:none}
}
</style>

/* ---------------- resolution ---------------- */
function apply(fid, c){
  if (!S.playing || S.paused || !c || !S.curses.includes(c)) return;
  const F = FAIRY_BY[fid], rt = S.f[fid], now = S.time;
  if (now < rt.stunUntil){ toast(t('t_stun'), true); shake(fid); return; }
  if (now < rt.cdUntil){ toast(t('t_cd')); shake(fid); return; }
  if (F.shots && rt.charges <= 0){ toast(t('t_noshots'), true); shake(fid); return; }
  if (c.eye && !F.eyeSafe){
    S.score = Math.max(0, S.score - 50); S.combo = 0; rt.stunUntil = now + 3;
    if (c.stage < 3){ c.stage++; c.growAt = now + S.cfg.grow; renderCurse(c); }
    wince(); sfx.trap(); popAt(c, t('t_trap'), 'bad'); toast(t('t_trap'), true); shake(fid); updateHUD(); return;
  }
  if (!F.vs.includes(c.type)){
    S.score = Math.max(0, S.score - 20); S.combo = 0; rt.cdUntil = now + 1.5;
    sfx.bad(); popAt(c, t('t_miss'), 'bad'); shake(fid); updateHUD(); return;
  }
  if (F.shots){ rt.charges--; const card = cardOf(fid); if (card) $$('.charges i', card).forEach((i, k) => i.classList.toggle('used', k >= rt.charges)); }
  rt.cdUntil = now + F.cd;
  S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); bumpCombo(); if (S.combo % 5 === 0) hearts(c); if (S.combo === 10 || S.combo === 20) setTimeout(() => brandPop(c), 260);
  const prev = c.stage; c.stage -= F.power; c.growAt = now + S.cfg.grow;
  if (c.stage <= 0){
    let pts = 100 * prev * mult(); const notes = [];
    if (now - c.born <= 2){ pts += 50; notes.push(t('t_instant')); }
    if (c.eye){ pts += 100; notes.push(t('t_delicate')); }
    if (F.shots && prev === 3){ pts += 150; notes.push(t('t_precision')); }
    if (F.shots && prev === 1) toast(t('t_waste'));
    pts = Math.round(pts); S.score += pts; S.nightCleared++; S.totalDispelled++; S.hitsBy[fid] = (S.hitsBy[fid] || 0) + 1; S.clearedBy[c.type] = (S.clearedBy[c.type] || 0) + 1;
    popAt(c, `+${pts}`); notes.forEach((n, i) => setTimeout(() => popAt(c, n, 'note'), 180 * (i + 1)));
    sparks(c, F.acc); sfx.dispel(); removeCurse(c, 'gone');
  } else {
    const pts = Math.round(40 * F.power * mult()); S.score += pts; renderCurse(c);
    c.el.classList.remove('hit'); void c.el.offsetWidth; c.el.classList.add('hit'); popAt(c, `+${pts}`); sfx.hit();
  }
  updateHUD();
}
function setIn(c){
  S.glow -= c.eye ? 15 : 12; S.nightSet++; S.setCount++; S.combo = 0;
  popAt(c, t('t_set'), 'bad'); sfx.set(); removeCurse(c, 'setin'); updateHUD();
}
function usePower(id){
  if (!S.playing || S.paused) return;
  if (S.powers[id] <= 0){ toast(t('t_used')); return; }
  const now = S.time;
  if (id === 'sleeping'){ S.powers[id]--; S.shieldUntil = now + 6; S.glow = Math.min(100, S.glow + 15); el.facebox.classList.add('shield'); toast(t('t_shield')); sfx.power(); }
  if (id === 'hydrogel'){
    const ones = S.curses.filter(c => c.stage === 1);
    if (!ones.length){ toast(t('t_nothing')); return; }
    S.powers[id]--; let total = 0;
    ones.forEach(c => { const pts = Math.round(100 * mult()); total += pts; S.nightCleared++; S.totalDispelled++; S.clearedBy[c.type] = (S.clearedBy[c.type] || 0) + 1; sparks(c, POWER_BY.hydrogel.acc); removeCurse(c, 'gone'); });
    S.score += total; toast(`${t('t_burst')} +${total}`); sfx.power();
  }
  renderPowers(); updateHUD();
}

/* ---------------- loop ---------------- */
function tick(ts){
  if (!S.playing) return;
  const dt = Math.min(.05, (ts - S.lastTick) / 1000); S.lastTick = ts;
  if (!S.paused){
    S.time += dt; const now = S.time, cfg = S.cfg, shielded = now < S.shieldUntil;
    if (!shielded && el.facebox.classList.contains('shield')) el.facebox.classList.remove('shield');
    if (S.spawned < cfg.quota && S.curses.length < cfg.max && now >= S.nextSpawn){ spawnCurse(); S.nextSpawn = now + cfg.spawn * rnd(.8, 1.2); }
    for (const c of [...S.curses]){
      if (shielded){ c.growAt += dt; continue; }
      if (now >= c.growAt){ if (c.stage < 3){ c.stage++; c.growAt = now + cfg.grow; renderCurse(c); } else setIn(c); }
    }
    updateCooldowns(now);
    if (S.glow <= 0){ S.glow = 0; updateHUD(); endGame('morning'); return; }
    if (S.spawned >= cfg.quota && S.curses.length === 0){ endNight(); return; }
  }
  S.raf = requestAnimationFrame(tick);
}

function checksum(e){ let h = 0x811c9dc5; const s = `${e.score}|${e.nights}|${e.duration}|${e.dispelled}|${CONFIG.SALT}`; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
const LB = {
  key:'kiki_lb_v1',
  sort(a){ return a.sort((p, q) => q.score - p.score || q.nights - p.nights || p.duration - q.duration || p.at - q.at); },
  local(){ try { const a = JSON.parse(store.get(this.key) || 'null'); if (Array.isArray(a)) return a.filter(r => r && !r.sample); } catch {} return []; },
  save(a){ store.set(this.key, JSON.stringify(a.slice(0, 200))); },
  async top(){
    if (CONFIG.LEADERBOARD_URL){
      const r = await fetch(`${CONFIG.LEADERBOARD_URL}?top=${CONFIG.TOP_N}&_=${Date.now()}`, {cache:'no-store'});
      const j = await r.json(); return {rows:Array.isArray(j) ? j : (j.rows || []), remote:true};
    }
    return {rows:this.sort(this.local()).slice(0, CONFIG.TOP_N), remote:false};
  },
  async submit(entry){
    if (CONFIG.LEADERBOARD_URL){
      try {
        const r = await fetch(CONFIG.LEADERBOARD_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(entry), redirect:'follow'});
        const j = await r.json(); if (j && j.ok) return {rank:j.rank, total:j.total, remote:true};
      } catch {}
      return {...this.submitLocal(entry), failed:true};
    }
    return this.submitLocal(entry);
  },
  submitLocal(entry){
    const a = this.local(); const {email, ...safe} = entry; a.push(safe); this.sort(a); this.save(a);
    return {rank:a.findIndex(x => x.at === entry.at) + 1, total:a.length, remote:false};
  }
};

  else if (act === 'nextNight') nextNight();
  else if (act === 'resume'){ closeScreen(); S.paused = false; S.screen = 'play'; S.lastTick = performance.now(); }
  else if (act === 'stop'){ if (S.playing){ S.nightsDone = Math.max(S.nightsDone, S.night - 1); } endGame('stop'); }
  else if (act === 'quit') showTitle();
  else if (act === 'form') showForm();
  else if (act === 'lang'){ lang = lang === 'en' ? 'ko' : 'en'; store.set('kiki_lang', lang); document.documentElement.lang = lang; showTitle(); }
  else if (act === 'sound'){ soundOn = !soundOn; store.set('kiki_sound', soundOn ? 'on' : 'off'); b.textContent = soundOn ? t('sound_on') : t('sound_off'); if (soundOn) sfx.tap(); }
  else if (act === 'share'){ const url = location.href.split('#')[0]; const done = () => toast(t('copied')); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done)); else fallbackCopy(url, done); }
});
function fallbackCopy(text, done){ const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch {} ta.remove(); }
addEventListener('keydown', e => {
  if (S.screen === 'story' && st){ if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') storyGo(st.i + 1); else if (e.key === 'ArrowLeft') storyGo(st.i - 1); else if (e.key === 'Escape') storyEnd('title'); return; }
  if (S.screen !== 'play' || !S.playing) return;
  if (e.key === 'Escape'){ if (!S.paused) showPause(); return; }
  const k = parseInt(e.key, 10); if (Number.isNaN(k)) return;
  const idx = k === 0 ? 9 : k - 1; const id = S.deck[idx]; if (id){ selectFairy(id); pointerType = 'mouse'; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.playing && !S.paused) showPause(); });

/* ---------------- story intro (card news) ---------------- */
const STORY_N = 8, STORY_MS = 3000;
let st = null;
const kikiBox = (awake, extra = '') => `<div class="kiki" style="--awake:${awake}"><svg viewBox="0 0 400 520" aria-hidden="true"><use href="#kiki"/></svg>${extra}</div>`;
const pct = (x, y) => `left:${(x / 400 * 100).toFixed(1)}%;top:${(y / 520 * 100).toFixed(1)}%`;
function storyCap(i, extra = ''){
  const d = t('st_diary')[i];
  return `<div class="cap"><div class="ey">${esc(t('story_ey')[i])}</div>${d ? `<p class="diary">${esc(d)}</p>` : ''}<p>${t('st')[i]}</p>${extra}</div>`;
}
function storyCardHTML(i){
  const Z = ZONES, glints = [[126,244],[274,238],[100,332],[300,340],[200,408]].map(([x, y], k) => `<i class="glint" style="${pct(x, y)};animation-delay:${(k * .35).toFixed(2)}s"></i>`).join('');
  let scene = '';
  if (i === 0) scene = `<div class="skyd"></div><div class="sun"></div>${kikiBox(1, glints)}`;
  else if (i === 1){
    const q = t('story_q'), calls = [[112,352],[288,396],[254,250]].map(([x, y], k) => `<span class="callout" style="${pct(x, y)};animation-delay:${(.4 + k * .7).toFixed(2)}s">${esc(q[k])}</span>`).join('');
    scene = `<div class="skyd"></div><div class="sun"></div>${kikiBox(1, glints + calls)}`;
  }
  else if (i === 2) scene = `<div class="skyd"></div><div class="sun"></div><div class="moon2"></div>${kikiBox(1)}`;
  else if (i === 4){
    const flies = [['nia', 'right:6%;top:16%', 0], ['retinal', 'left:5%;top:26%', .3], ['eyecream', 'right:8%;top:50%', .6], ['cica', 'left:8%;top:60%', .9]]
      .map(([id, pos, d]) => { const f = FAIRY_BY[id]; return `<div class="fairy-fly" style="${pos};animation-delay:${d}s,${(1.2 + d).toFixed(2)}s">${fairyIcon(f)}<span class="nm">${esc(f.name)}</span></div>`; }).join('');
    scene = `<div class="moon2" style="animation-delay:0s"></div>${kikiBox(0)}<div class="route">SEOUL ✈ LA</div>${flies}`;
  } else if (i === 3){
    const pops = [['acne', Z.lcheek, .2], ['spot', Z.rcheek, .7], ['wrinkle', Z.forehead, 1.2], ['eye_dark', Z.leye, 1.7]]
      .map(([c, z, d]) => `<div class="curse-pop" style="${pct(z.cx, z.cy)};animation-delay:${d}s"><svg viewBox="0 0 64 64"><use href="#c-${c}"/></svg><span class="lb">${esc(tn('cursek', c))}</span></div>`).join('');
    scene = `<div class="moon2" style="animation-delay:0s"></div>${kikiBox(0, pops)}`;
  } else if (i === 5){
    const z = Z.rcheek;
    const inner = `<div class="zap" style="${pct(z.cx, z.cy)}"><svg viewBox="0 0 64 64"><use href="#c-spot"/></svg></div><div class="swoop" style="${pct(z.cx, z.cy)}">${fairyIcon(FAIRY_BY.nia)}</div>` +
      [[250,290],[300,340],[240,350]].map(([x, y], k) => `<i class="glint" style="${pct(x, y)};animation-delay:${(1.9 + k * .2).toFixed(2)}s"></i>`).join('');
    scene = `<div class="moon2" style="animation-delay:0s"></div>${kikiBox(0, inner)}`;
  } else if (i === 6){
    const days = t('day');
    scene = `<div class="moon2" style="animation-delay:0s"></div><div class="week">${days.map((d, k) => `<i class="${k === 6 ? 'prom' : ''}" style="animation-delay:${(k * .3).toFixed(2)}s">${esc(d)}<b></b>${k === 6 ? '<small>PROM</small>' : ''}</i>`).join('')}</div>`;
  } else {
    scene = `<div class="lockup"><span class="logo-ks"></span><span class="logo-s88"></span><div class="logo2">Kiki's <span>SECRET</span></div></div>`;
    return `<div class="sc"><div class="scene">${scene}</div>${storyCap(7, `<div class="cta"><button type="button" class="btn primary" data-act="storyPlay">${esc(t('story_play'))}</button><button type="button" class="btn" data-act="storySkip">${esc(t('story_later'))}</button></div><small class="note" style="color:var(--mute)">${esc(t('story_hint'))}</small>`)}</div>`;
  }
  return `<div class="sc"><div class="scene">${scene}</div><div class="tapzone"></div>${storyCap(i)}</div>`;
}
function showStory(){
  S.screen = 'story'; S.playing = false; cancelAnimationFrame(S.raf); el.wand.classList.remove('on');
  el.screens.innerHTML = `<section class="story" role="dialog" aria-modal="true" aria-label="Story"><div class="story-bg"></div><div class="story-panel" id="storyPanel">
    <div class="story-top"><div class="story-bars" id="storyBars">${Array.from({length:STORY_N}, () => '<i><b></b></i>').join('')}</div>
    <div class="story-head"><span class="who"><span class="av"><svg viewBox="88 150 224 224" aria-hidden="true" style="--awake:1"><use href="#kiki"/></svg></span>kikis.secret <span style="color:var(--mute);font-weight:400">· ${esc(t('story_now'))}</span></span><button type="button" class="btn" data-act="storySkip">${esc(t('story_skip'))}</button></div></div>
    <div id="storyCard"></div></div></section>`;
  st = {i:0, startedAt:0, elapsed:0, paused:false, raf:0};
  storyGo(0, $('#splash') ? 1500 : 0); storyBind();
}
function storyGo(i, delay = 0){
  if (!st) return;
  if (i < 0) i = 0;
  if (i >= STORY_N){ storyEnd('play'); return; }
  st.i = i; const card = $('#storyCard'); if (!card) return; card.innerHTML = storyCardHTML(i);
  $$('#storyBars i').forEach((b, k) => { b.firstElementChild.style.width = k < i ? '100%' : '0'; });
  st.startedAt = performance.now() + delay; st.elapsed = 0; st.paused = false;
  if (i === 2) setTimeout(() => { if (!st || st.i !== 2) return; const k = card.querySelector('.kiki'); if (k) k.style.setProperty('--awake', '0'); const d = card.querySelector('.skyd'); if (d) d.style.opacity = '0'; const su = card.querySelector('.sun'); if (su) su.style.opacity = '0'; }, 1400 + delay);
  cancelAnimationFrame(st.raf); st.raf = requestAnimationFrame(storyTick);
}
function storyTick(ts){
  if (!st || S.screen !== 'story') return;
  if (st.paused) st.startedAt = ts - st.elapsed; else st.elapsed = Math.max(0, ts - st.startedAt);
  const bars = $$('#storyBars i'), bar = bars[st.i];
  if (bar) bar.firstElementChild.style.width = Math.min(100, st.elapsed / STORY_MS * 100).toFixed(1) + '%';
  if (st.i < STORY_N - 1 && st.elapsed >= STORY_MS){ storyGo(st.i + 1); return; }
  st.raf = requestAnimationFrame(storyTick);
}
function storyBind(){
  const panel = $('#storyPanel'); let down = null;
  panel.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = {x:e.clientX, y:e.clientY, t:performance.now()}; if (st) st.paused = true; });
  panel.addEventListener('pointerup', e => {
    if (!down || !st) return; const dx = e.clientX - down.x, dy = e.clientY - down.y, dt = performance.now() - down.t; down = null; st.paused = false;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ storyGo(st.i + (dx < 0 ? 1 : -1)); return; }
    if (dt < 320 && Math.abs(dx) < 12 && Math.abs(dy) < 12){ const r = panel.getBoundingClientRect(); storyGo(st.i + ((e.clientX - r.left) < r.width * .3 ? -1 : 1)); }
  });
  panel.addEventListener('pointercancel', () => { down = null; if (st) st.paused = false; });
  panel.addEventListener('pointerleave', () => { if (down){ down = null; if (st) st.paused = false; } });
}
function storyEnd(mode){
  store.set('kiki_intro_seen', '1'); if (st) cancelAnimationFrame(st.raf); st = null; closeScreen();
  if (mode === 'play'){ audio(); newGame(); } else showTitle();
}

/* ---------------- boot ---------------- */
function splash(){
  if ($('#splash')) return;
  const d = document.createElement('div'); d.id = 'splash'; d.className = 'splash'; d.setAttribute('aria-hidden', 'true');
  d.innerHTML = '<span class="logo-ks"></span><span class="logo-s88"></span><small>presents</small>';
  d.addEventListener('click', () => d.remove()); document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
}
function start(){
  document.documentElement.lang = lang; stars(); layout(); updateHUD(); splash(); if (store.get('kiki_intro_seen')) showTitle(); else showStory();
  try { window.claude?.hot?.snapshot?.(() => ({lang})); } catch {}
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start();
})();
</script>
</body>
