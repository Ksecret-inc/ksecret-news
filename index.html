<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케이시크릿 소식</title>
<meta name="description" content="SEOUL 1988을 만드는 케이시크릿의 업무 일정, 인사이트, 팀 이야기.">
<meta property="og:title" content="케이시크릿 소식">
<meta property="og:description" content="SEOUL 1988을 만드는 케이시크릿의 업무 일정, 인사이트, 팀 이야기.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* SEOUL 1988 palette, sampled from the brand film */
:root{
  --paper:#FFFFFF;      /* the film's last frame */
  --cream:#F6F2E7;      /* bottle body, lightened */
  --bottle:#EAE4CF;     /* bottle body */
  --butter:#E6E0B5;     /* cream texture */
  --red:#C64046;        /* SEOUL 1988 label */
  --red-ink:#A8323A;    /* red for text and buttons on light grounds */
  --ink:#1F1B18; --mute:#746D66; --line:#E8E3D7;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Oswald","Arial Narrow","IBM Plex Sans KR",sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:inherit}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2,h3{font-weight:600;letter-spacing:-.025em}

/* ---------- header: menu only ---------- */
.site-head{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .35s var(--ease),box-shadow .35s var(--ease)}
.site-head.solid{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.site-head .wrap{display:flex;align-items:center;justify-content:flex-end;height:60px}
.site-head nav{display:flex;gap:1.6rem;font-size:.95rem}
.site-head nav a{text-decoration:none;color:var(--mute);padding:.3rem 0;position:relative}
.site-head nav a:hover,.site-head nav a[aria-current="true"]{color:var(--ink)}
.site-head nav a[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--red)}
.story-bar{position:absolute;left:0;bottom:0;height:2px;width:100%;transform-origin:left;transform:scaleX(var(--hp,0));background:var(--ink);transition:opacity .3s}
.site-head.solid .story-bar{opacity:0}

/* ---------- hero: campaign film scrubbed by scroll ---------- */
.hero{position:relative;height:640vh}
@media (max-aspect-ratio:1/1){.hero{height:540vh}}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#fff}
.film{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;background:#fff;clip-path:inset(1px)}
.film video,.film canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.static .hero{height:auto}
.static .stage{position:relative}
/* opening: the film first shows through a capsule, like looking into the bottle */
.film{transition:background .4s}


/* ---------- shared bits ---------- */
.sec-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:1.2rem 2rem;margin-bottom:2.4rem}
.sec-head h2{font-size:clamp(2rem,4.4vw,3.1rem);line-height:1.15;margin:0}
.sec-head .lede{margin:.55rem 0 0;color:var(--mute);max-width:42ch}
.ghost{font:500 .88rem/1 var(--body);padding:.62rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:border-color .2s}
.ghost:hover{border-color:var(--mute)}
.ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.body{white-space:pre-line;max-width:62ch;margin:0}
.body a{color:var(--red-ink);text-underline-offset:3px}
.new{font-size:.76rem;font-weight:600;padding:.16rem .5rem;border-radius:6px;background:var(--red);color:#fff}
.empty{padding:2.4rem 0;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:.2rem}
.chev{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .35s var(--ease),background .25s}
.chev svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
[aria-expanded="true"] .chev{transform:rotate(180deg);background:var(--bottle)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.panel>div{overflow:hidden}
[aria-expanded="true"]+.panel{grid-template-rows:1fr}
.actions{margin-top:1.2rem;display:flex;gap:.6rem}
.sk{height:4.6rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:.5rem}
.sk span{height:.85rem;border-radius:6px;background:var(--cream);width:40%}
.sk span:last-child{width:70%;height:1.05rem}

/* ---------- schedule + insights: a 3D ring of cards turned by scrolling ---------- */
.people{position:relative;z-index:2;margin-top:-45vh}
.static .people{margin-top:0}
.static .people{margin-top:0}
.hz{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;padding:48px 0 28px;isolation:isolate}
.hz-film{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;object-fit:cover;opacity:var(--fo,0);transition:opacity .6s var(--ease);will-change:transform}
.hz-film{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 32%);mask-image:linear-gradient(to bottom,transparent,#000 32%)}
.static .hz-film{display:none}
.hz::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 38% at 50% 14%,rgba(255,255,255,.92),rgba(255,255,255,0) 70%),linear-gradient(to top,rgba(255,255,255,.75),rgba(255,255,255,0) 22%)}
.hz>:not(.hz-film){position:relative;z-index:1}
.ring-head{text-align:center;padding:0 1.25rem}
.ring-head h1{font-size:clamp(1.8rem,3.4vw,2.7rem);font-weight:700;line-height:1.28;letter-spacing:-.035em;margin:0 auto;max-width:15em;text-wrap:balance}
.ring-meta{display:flex;justify-content:center;align-items:center;gap:.7rem;margin-top:1.1rem;flex-wrap:wrap}
.ring-meta .c{display:inline-flex;align-items:center;gap:.65rem;padding:.4rem 1.1rem .4rem .4rem;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 10px 26px -14px rgba(60,30,20,.45),inset 0 0 0 1px var(--line);font-size:1rem;font-weight:600;color:var(--ink)}
.ring-meta .c b{display:grid;place-items:center;min-width:2.3rem;height:2.3rem;padding:0 .45rem;border-radius:999px;font-family:var(--num);font-weight:600;font-size:1.3rem;line-height:1;color:#fff;background:var(--red)}
.ring-meta .c.ins b{background:var(--ink)}
.ring-stage{position:relative;perspective:1500px;perspective-origin:50% 40%;display:grid;place-items:center;min-height:0}
.ring{position:relative;width:var(--cw);height:var(--ch);transform-style:preserve-3d;will-change:transform}
.rcard{position:absolute;inset:0;border-radius:26px;padding:1.5rem 1.5rem 1.4rem;display:flex;flex-direction:column;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 60px -36px rgba(60,30,20,.45);transition:box-shadow .3s}
.rcard:hover{box-shadow:0 34px 70px -30px rgba(60,30,20,.55)}
.rcard:focus-visible{outline:3px solid var(--red-ink);outline-offset:4px}
.rcard .kind{display:flex;align-items:center;gap:.5rem;font-size:.84rem;color:var(--mute);flex-wrap:wrap}
.rcard .kind .dot{width:.6rem;height:.6rem}
.rcard h3{font-size:clamp(1.15rem,1.8vw,1.4rem);line-height:1.35;margin:.7rem 0 .5rem}
.rcard .body{font-size:.92rem;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.rcard .open{margin-top:auto;padding-top:.8rem;font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:.35rem;opacity:.75}
.rcard .bigdate{font-family:var(--num);line-height:.9;color:var(--red);margin-top:auto}
.rcard .bigdate .m{display:block;font-size:1rem;font-weight:500;color:var(--ink);margin-bottom:.25rem}
.rcard .bigdate .d{display:block;font-size:clamp(3.6rem,6vw,4.8rem);font-weight:600;letter-spacing:-.02em}
.rcard .bigdate .w{display:block;font-family:var(--body);font-size:.9rem;color:var(--mute);margin-top:.35rem}
.r-ev{background:var(--cream)}
.r-ev.next{background:var(--red);color:#fff}
.r-ev.next .kind,.r-ev.next .bigdate,.r-ev.next .bigdate .m,.r-ev.next .bigdate .w{color:#fff}
.r-ev.next .dot{background:#fff}
.r-ev.next .dday{border-color:#fff;color:#fff}
.r-ev.next .where svg{stroke:#fff}
.r-in{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line),0 30px 60px -36px rgba(60,30,20,.45)}
.r-in .when-big{font-family:var(--num);font-weight:600;font-size:1.7rem;line-height:1;margin-top:1.2rem}
.r-in .when-big small{font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--mute);margin-left:.45rem}
.r-empty{background:var(--cream);color:var(--mute);justify-content:center;cursor:default}
.r-empty b{color:var(--ink);display:block;margin-bottom:.3rem}
.where{display:flex;flex-direction:column;gap:.1rem;font-size:.9rem}
.where span{display:flex;gap:.45rem;align-items:center}
.where svg{width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:2;flex:none}
.dday{font-family:var(--num);font-weight:500;font-size:.92rem;letter-spacing:.02em;padding:.12rem .55rem;border-radius:999px;border:1.5px solid var(--red);color:var(--red-ink);white-space:nowrap;margin-left:auto}
.dday.today{background:var(--red);color:#fff}
.c-event{background:var(--red)}
.c-insight{background:var(--butter);box-shadow:inset 0 0 0 1px #CFC690}
.c-notice{background:var(--ink)}
.hz-bar{width:min(520px,100% - 2.5rem);margin:0 auto;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.hz-bar span{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(var(--hzp,0))}
.static .hz{position:relative;height:auto;min-height:100svh}
@media (max-width:760px){
  .hz{padding-top:40px}
  .ring-stage{perspective:1000px}
}

/* ---------- the list page (#work) ---------- */
.work{display:none;padding:56px 0 5rem;min-height:100vh}
.in-work .work{display:block}
.in-work main>section:not(.work){display:none}
.in-work .site-head{background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;color:var(--mute);font-size:.92rem;margin-bottom:1.6rem}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--red-ink);outline-offset:3px;border-radius:6px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.work h1{font-size:clamp(1.9rem,4vw,3rem);font-weight:700;line-height:1.25;letter-spacing:-.035em;margin:0 0 1.8rem;max-width:16em}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:3rem}
.work h2{font-size:1.35rem;margin:0 0 1.2rem;display:flex;align-items:baseline;gap:.6rem}
.work h2 .n{font-family:var(--num);font-weight:500;color:var(--mute);font-size:1.1rem}
.w-block{margin-bottom:4rem}
.month{font-family:var(--num);font-weight:500;font-size:1rem;letter-spacing:.04em;color:var(--mute);margin:2rem 0 .4rem;padding-bottom:.5rem;border-bottom:2px solid var(--ink)}
.w-ev{display:grid;grid-template-columns:5.2rem 1fr auto;gap:1.2rem;align-items:start;padding:1.2rem .3rem;border-bottom:1px solid var(--line);scroll-margin-top:110px;border-radius:12px;transition:background .6s}
.w-ev .date{font-family:var(--num);line-height:1}
.w-ev .date b{display:block;font-size:2.2rem;font-weight:600;color:var(--red)}
.w-ev .date i{font-style:normal;display:block;font-family:var(--body);font-size:.82rem;color:var(--mute);margin-top:.3rem}
.w-ev .t{font-weight:600;font-size:1.12rem;line-height:1.45}
.w-ev .s{color:var(--mute);font-size:.88rem;display:flex;gap:.2rem .9rem;flex-wrap:wrap;margin-top:.2rem}
.w-ev .body{margin-top:.6rem;font-size:.95rem}
.w-ev.past .date b{color:var(--mute)}
.w-ev.past{opacity:.7}
.w-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.w-in{border-radius:22px;padding:1.6rem;box-shadow:inset 0 0 0 1px var(--line);scroll-margin-top:110px;transition:box-shadow .6s,background .6s;display:flex;flex-direction:column}
.w-in .meta{margin-bottom:.6rem}
.w-in h3{font-size:1.25rem;line-height:1.4;margin:0 0 .6rem}
.w-in .actions{margin-top:auto;padding-top:1rem}
.focus{background:color-mix(in srgb,var(--butter) 55%,transparent)}
.w-in.focus{box-shadow:inset 0 0 0 2px var(--red)}
.past-toggle{margin-top:1.2rem}
@media (max-width:760px){
  .w-ev{grid-template-columns:4.2rem 1fr;gap:.9rem}
  .w-ev .dday{grid-column:2;justify-self:start;margin-left:0}
}

/* ---------- news ---------- */
.news{padding:5.5rem 0 5.5rem;border-top:1px solid var(--line)}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;font:inherit;font-size:.95rem;padding:.78rem 1rem .78rem 2.6rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.search input:focus{outline:2px solid var(--red-ink);outline-offset:1px}
.search svg{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:-1rem 0 2.2rem}
.chip{font:500 .92rem/1 var(--body);padding:.6rem .95rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--num);font-size:.85rem;opacity:.6}
.dot{width:.7rem;height:.7rem;border-radius:50%;flex:none}
.c-team{background:var(--bottle);box-shadow:inset 0 0 0 1px #D6CDB0}
.c-product{background:var(--butter);box-shadow:inset 0 0 0 1px #CFC690}
.c-hiring{background:var(--red)}
.featured{display:grid;grid-template-columns:1fr minmax(140px,240px);gap:clamp(1.5rem,4vw,4rem);align-items:center;background:var(--cream);border-radius:28px;padding:clamp(1.6rem,4vw,3rem);margin-bottom:2.4rem;scroll-margin-top:96px}
.meta{color:var(--mute);font-size:.9rem;display:flex;gap:.4rem 1rem;flex-wrap:wrap;align-items:center}
.cat{display:inline-flex;align-items:center;gap:.45rem;font-weight:500;color:var(--ink)}
.featured h3{font-size:clamp(1.55rem,3.4vw,2.3rem);line-height:1.3;margin:.7rem 0 .9rem}
.featured .mark{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-family:var(--num);font-weight:600;font-size:clamp(1.6rem,3vw,2.4rem);color:var(--red);letter-spacing:.01em;text-align:center;line-height:1}
.featured .mark small{display:block;font-size:.42em;color:var(--mute);font-weight:500;margin-top:.4rem;letter-spacing:.08em}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);scroll-margin-top:96px}
.row-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:7rem 1fr auto;gap:1.2rem;align-items:center;padding:1.3rem .3rem}
.row-btn:focus-visible{outline:2px solid var(--red-ink);outline-offset:-2px;border-radius:8px}
.when{color:var(--mute);font-size:.9rem;font-family:var(--num);letter-spacing:.02em}
.row-main{display:flex;gap:.9rem;align-items:flex-start}
.row-main .dot{margin-top:.6rem}
.row-title{display:block;font-weight:600;font-size:clamp(1.05rem,2vw,1.22rem);line-height:1.45}
.row-sub{display:flex;gap:.3rem .8rem;flex-wrap:wrap;color:var(--mute);font-size:.86rem;margin-top:.2rem}
.panel-inner{padding:0 .3rem 1.6rem calc(7rem + 1.2rem + .3rem + 1.6rem)}
.more{display:flex;justify-content:center;margin-top:1.8rem}

footer{padding:3rem 0 3.5rem;color:var(--mute);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem}
footer p{margin:0}

.toast{visibility:hidden;opacity:0;position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,140%);background:var(--ink);color:var(--paper);padding:.8rem 1.2rem;border-radius:999px;font-size:.92rem;transition:transform .35s var(--ease),opacity .25s,visibility 0s .35s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s var(--ease),opacity .25s}

@media (max-width:760px){
  .site-head .wrap{justify-content:center}
  .site-head nav{gap:1.2rem;font-size:.9rem}
  .sec-head{grid-template-columns:1fr}
  .search{width:100%}
  .featured{grid-template-columns:1fr}
  .featured .mark{display:none}
  .row-btn{grid-template-columns:1fr auto;gap:.35rem 1rem}
  .when{grid-column:1 / -1}
  .panel-inner{padding-left:1.9rem}
  .how-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .panel,.chev,.toast,.site-head{transition:none}
}
</style>
</head>
<body>

<main>
  <section class="hero" id="top" aria-label="SEOUL 1988 캠페인 영상">
    <div class="stage" id="stage">
      <div class="film" id="introWrap"><video id="intro" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video></div>
    </div>
  </section>
  <section class="people" id="people" aria-labelledby="people-h">
    <div class="hz" id="hz">
      <video class="hz-film" id="film" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <div class="ring-head">
        <h1 id="people-h">일정과 인사이트를 공유합니다</h1>
        <div class="ring-meta">
          <span class="c"><b id="evCount">–</b>다가오는 일정</span>
          <span class="c ins"><b id="ntCount">–</b>인사이트</span>
        </div>
      </div>
      <div class="ring-stage" id="ringStage"><div class="ring" id="ring" role="list" aria-label="일정과 인사이트 카드"></div></div>
      <div class="hz-bar" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <section class="work" id="workView" aria-labelledby="work-h">
    <div class="wrap">
      <button class="back" type="button" id="backBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>처음으로</button>
      <h1 id="work-h">일정과 인사이트</h1>
      <div class="tabs" id="workTabs" role="group" aria-label="보기"></div>
      <div id="workBody"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  const introSrc = () => portrait.matches ? "film/intro-m.mp4" : "film/intro-d.mp4";
  const ipreview = Array.isArray(window.__PREVIEW_INTRO) ? window.__PREVIEW_INTRO : null;
  let iShown = 0, iRunning = false, heroVisible = true, iCanvas = null, ictx = null, iBlobs = [], iWant = -1, iDrawn = -1, iBusy = false, iBlobUrl = null, iToken = 0;

  function heroProgress() {
    if (root.classList.contains("static")) return 1;
    const r = hero.getBoundingClientRect();
    return clamp(-r.top / (hero.offsetHeight - innerHeight));
  }
  // preview only: frames decoded from embedded bytes straight onto a canvas
  function iBlob(i) {
    if (!iBlobs[i]) {
      const bin = atob(ipreview[i].slice(ipreview[i].indexOf(",") + 1)), u = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
      iBlobs[i] = new Blob([u], {type: "image/jpeg"});
    }
    return iBlobs[i];
  }
  function iSize() { const d = Math.min(devicePixelRatio || 1, 2); iCanvas.width = stage.clientWidth * d; iCanvas.height = stage.clientHeight * d; iDrawn = -1; iDraw(Math.max(iWant, 0)); }
  function iDraw(i) {
    iWant = i;
    if (iBusy || i === iDrawn) return;
    iBusy = true;
    createImageBitmap(iBlob(i)).then(bm => {
      const W = iCanvas.width, H = iCanvas.height, s = Math.max(W / bm.width, H / bm.height), w = bm.width * s, h = bm.height * s;
      ictx.fillStyle = "#fff"; ictx.fillRect(0, 0, W, H); ictx.drawImage(bm, (W - w) / 2, (H - h) / 2, w, h); bm.close && bm.close();
      iDrawn = i;
    }).catch(() => {}).finally(() => { iBusy = false; if (iWant !== iDrawn) iDraw(iWant); });
  }

  function loadIntro() {
    const isStatic = root.classList.contains("static");
    if (ipreview) {
      if (!iCanvas) { iCanvas = el("canvas"); iCanvas.setAttribute("aria-hidden", "true"); intro.replaceWith(iCanvas); ictx = iCanvas.getContext("2d"); addEventListener("resize", iSize); }
      iSize(); iDraw(isStatic ? ipreview.length - 1 : 0); startBg(); return;
    }
    const src = introSrc(), token = ++iToken;
    intro.src = src; intro.load();
    if (isStatic) { intro.addEventListener("loadeddata", () => { intro.currentTime = IDUR - .1; }, {once: true}); startBg(); return; }
    intro.play().then(() => intro.pause()).catch(() => {});
    // fetch the whole file so every seek is served from memory, then let the background film start loading
    fetch(src).then(res => { if (!res.ok) throw new Error(res.status); return res.blob(); }).then(b => {
      if (token !== iToken) return;
      const at = intro.currentTime;
      if (iBlobUrl) URL.revokeObjectURL(iBlobUrl);
      iBlobUrl = URL.createObjectURL(b);
      intro.src = iBlobUrl; intro.load();
      intro.addEventListener("loadeddata", () => { intro.currentTime = at; }, {once: true});
    }).catch(() => {}).finally(startBg);
  }
  portrait.addEventListener("change", loadIntro);

  const OPEN = .07;            // share of the hero scroll spent opening the capsule
  let prevShown = 0, iBlur = 0;
  const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function heroFrame() {
    const p = heroProgress();
    const W = stage.clientWidth, H = stage.clientHeight;

    // 1) opening: a capsule window widens until the film fills the screen
    const o = easeIO(clamp(p / OPEN));
    const cw = clamp(W * .2, 170, 300), chh = Math.min(H * .64, cw * 2.5);
    const ix = ((W - cw) / 2) * (1 - o) + 1, iy = ((H - chh) / 2) * (1 - o) + 1, rad = (cw / 2) * (1 - o);
    iwrap.style.clipPath = `inset(${iy.toFixed(1)}px ${ix.toFixed(1)}px round ${rad.toFixed(1)}px)`;
    iwrap.style.background = o < 1 ? "#ECEEEA" : "#fff";

    const target = clamp((p - OPEN) / (IEND - OPEN)) * IDUR;
    iShown += (target - iShown) * .2;                   // eased scrub, feels like a dial
    if (Math.abs(target - iShown) < .004) iShown = target;
    if (ipreview) iDraw(Math.round(iShown / IDUR * (ipreview.length - 1)));
    else if (intro.readyState >= 1 && !intro.seeking && Math.abs(intro.currentTime - iShown) > .02) intro.currentTime = Math.min(iShown, (intro.duration || IDUR) - .05);
    // after the logo lands, the frame shrinks and lifts while the ring rises from below
    const e = easeOut(clamp((p - IEND) / (1 - IEND)));
    iwrap.style.transform = `translateY(${(-14 * e).toFixed(2)}%) scale(${(1 - .34 * e).toFixed(4)})`;

    // 2) speed blur: a fast flick smears the film a little, slow scrolling stays crisp
    const dv = Math.abs(iShown - prevShown); prevShown = iShown;
    iBlur += (Math.min(innerWidth < 760 ? 3 : 6, dv * 36) - iBlur) * .3;
    (iCanvas || intro).style.filter = iBlur > .2 ? `blur(${iBlur.toFixed(2)}px)` : "none";

    if (heroVisible && !root.classList.contains("static")) requestAnimationFrame(heroFrame); else iRunning = false;
  }
  function heroStart() { if (!iRunning && !root.classList.contains("static")) { iRunning = true; requestAnimationFrame(heroFrame); } }
  loadIntro();
  if (!root.classList.contains("static")) {
    new IntersectionObserver(([en]) => { heroVisible = en.isIntersecting; if (heroVisible) heroStart(); }).observe(hero);
    heroStart();
  }
})();
</script>
</body>
</html>
