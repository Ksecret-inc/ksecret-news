name: 슬랙 소식 동기화 및 배포

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 슬랙에서 소식 가져오기
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          APPROVER_IDS: ${{ vars.APPROVER_IDS }}
          APPROVE_EMOJI: ${{ vars.APPROVE_EMOJI }}
        run: node scripts/sync-slack.mjs

      - name: 바뀐 소식 저장
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "ksecret-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/posts.json
            git commit -m "소식 동기화"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages 설정
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: 사이트 업로드
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deployment
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
